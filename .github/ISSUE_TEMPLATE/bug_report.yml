name: Bug report
description: Something does not work or Schemawise reports something wrong.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please never paste source code, connection strings or data.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what you got (error message, wrong drift, wrong risk level…).
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: 'Run "Schemawise: Copy Diagnostics" in VS Code and paste the result here (versions and statuses only).'
      render: markdown
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else?
      description: For example how the DbContext is configured (without secrets), or a screenshot.
